text_sensor:
  - platform: homeassistant
    id: ha_s1_raw
    entity_id: ${s1_entity}
    on_value:
      then:
        # Update icon: show unavailable glyph if raw state is unavailable/unknown/empty
        - lvgl.label.update:
            id: icon_s1
            text: !lambda |-
              auto st = id(ha_s1_raw).state;
              if (st == "unavailable" || st == "unknown" || st == "") {
                return std::string("${s1_unavail_icon}");
              }
              return std::string("${s1_icon}");
  - platform: homeassistant
    id: ha_s2_raw
    entity_id: ${s2_entity}
    on_value:
      then:
        # Update icon: show unavailable glyph if raw state is unavailable/unknown/empty
        - lvgl.label.update:
            id: icon_s2
            text: !lambda |-
              auto st = id(ha_s2_raw).state;
              if (st == "unavailable" || st == "unknown" || st == "") {
                return std::string("${s1_unavail_icon}");
              }
              return std::string("${s2_icon}");
  - platform: homeassistant
    id: ha_s3_raw
    entity_id: ${s3_entity}
    on_value:
      then:
        # Update icon: show unavailable glyph if raw state is unavailable/unknown/empty
        - lvgl.label.update:
            id: icon_s3
            text: !lambda |-
              auto st = id(ha_s3_raw).state;
              if (st == "unavailable" || st == "unknown" || st == "") {
                return std::string("${s1_unavail_icon}");
              }
              return std::string("${s3_icon}");
  - platform: homeassistant
    id: ha_s4_raw
    entity_id: ${s4_entity}
    on_value:
      then:
        # Update icon: show unavailable glyph if raw state is unavailable/unknown/empty
        - lvgl.label.update:
            id: icon_s4
            text: !lambda |-
              auto st = id(ha_s4_raw).state;
              if (st == "unavailable" || st == "unknown" || st == "") {
                return std::string("${s1_unavail_icon}");
              }
              return std::string("${s4_icon}");

        # Update numeric label: show fallback when unavailable, otherwise use numeric sensor value
        - lvgl.label.update:
            id: val_s1
            text: !lambda |-
              auto st = id(ha_s1_raw).state;
              if (st == "unavailable" || st == "unknown" || st == "") {
                return std::string("--");
              }
              if (isnan(id(ha_sensor_1).state)) return std::string("--");
              float c = id(ha_sensor_1).state;
              float f = c * 9.0f / 5.0f + 32.0f;
              return str_sprintf("%.0f°F", f);

  # Home Assistant weather hookup — map weather.forecast_home state to Material Icon ligatures
  - platform: homeassistant
    id: ha_weather
    entity_id: weather.forecast_home
    on_value:
      then:
        - lvgl.label.update:
            id: icon_s6
            text: !lambda |-
              std::string cond = id(ha_weather).state;
              // normalize: lowercase
              for (auto &c : cond) c = tolower(c);
              // remove spaces, underscores and hyphens
              std::string norm;
              for (char c : cond) if (c != ' ' && c != '_' && c != '-') norm.push_back(c);

              if (norm == "clear" || norm == "sunny" || norm == "clearnight" || norm == "clearnight") return std::string("wb_sunny");
              if (norm == "partlycloudy" || norm == "partlycloudy") return std::string("wb_sunny");
              if (norm == "cloudy" || norm == "mostlycloudy" || norm == "mostlycloudy") return std::string("cloud");
              if (norm == "rain" || norm == "rainy" || norm == "pouring" || norm == "showers") return std::string("umbrella");
              if (norm == "snow" || norm == "snowy") return std::string("ac_unit");
              if (norm == "fog" || norm == "mist" || norm == "haze") return std::string("filter_drama");
              if (norm == "windy" || norm == "breezy") return std::string("air");
              if (norm == "thunderstorm" || norm == "lightning" || norm == "storm") return std::string("flash_on");
              return std::string("${s6_icon}");

