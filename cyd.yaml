# Target hardware
# - Cheap Yellow Display (ESP32-2432S028 or compatible)
# - Built-in ILI9341 320x240 display
# - Built-in XPT2046 touchscreen
# #

esphome:
  name: cyd-bbq
  friendly_name: CYD-BBQ
  on_boot:
    priority: -10
    then:
      - light.turn_on: 
          id: backlight
          brightness: 1.0
          transition_length: 0s


esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "1qTsGlr1rsOWSJsoKyt9lORCPc1NkEkupG2G2wPKWPs="

ota:
  - platform: esphome
    password: "1ed06b601aa04938d5bd886ddfad48bf"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - logger.log: "WiFi connected successfully!"
      - light.turn_on: backlight


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cyd-1 Fallback Hotspot"
    password: "Ccw4tryg5OUL"

captive_portal:


  
substitutions:
  # ==============================================================================
  #  CONFIGURATION HEADER (MASTER TEMPLATE)
  #  Customize your sensors, icons, and labels below.
  #  The variable 'x' represents the current numerical value from the HA sensor.
  # ==============================================================================

  # --- SENSOR 1: Sensor 1, probe 1 ---
  s1_entity: "sensor.kitchen_wired_meat_thermometer_probe_1"
  s1_label: "S1 - P1"
  s1_unit: "°F"
  s1_tap_action: "script.dummy_script"
  s1_icon: "\ue1ff"
  # glyph to show when the entity is unavailable/invalid — change to any Material Icon code you like
  s1_unavail_icon: "\ue14b"
  
  s1_icon_logic: |-
    return "${s1_icon}"; 
    
  s1_color_logic: |-
    if (x > 0) return lv_color_hex(0xFFD700);    
    return lv_color_hex(0x888888);               

  # --- SENSOR 2: Sensor 1, probe 2  ---
  s2_entity: "sensor.kitchen_wired_meat_thermometer_probe_2"
  s2_label: "S1 - P2"
  s2_unit: "°F"
  s2_tap_action: "script.trigger_water_heater"
  s2_icon: ${s1_icon}  # <--- Reference s1 instead of typing "\ue1ff" again
  # glyph to show when the entity is unavailable/invalid — change to any Material Icon code you like
  s2_unavail_icon: "$s1_unavail_icon"
  
  s2_icon_logic: |-
    return "${s2_icon}";
    
  s2_color_logic: |-
    if (x > 0) return lv_color_hex(0x28FFB6);    
    return lv_color_hex(0x888888);               

  # --- SENSOR 3: Sensor 2 - Probe 1 ---
  s3_entity: "sensor.wireless_meat_thermometer_probes_2_probe_1"
  s3_label: "S2 - P1"
  s3_unit: "°F"
  s3_tap_action: "script.dummy_script"
  s3_icon: ${s1_icon}  # <--- Reference s1 instead of typing "\ue1ff" again
  # glyph to show when the entity is unavailable/invalid — change to any Material Icon code you like
  s3_unavail_icon: "$s1_unavail_icon"
  
  s3_icon_logic: |-
    return "${s3_icon}";
    
  s3_color_logic: |-
    if (x > 0) return lv_color_hex(0xFF5252); 
    return lv_color_hex(0x888888);               

  # --- SENSOR 4: Sensor 2 - Probe 2 ---
  s4_entity: "sensor.wireless_meat_thermometer_probes_2_probe_2"
  s4_label: "S2 - P2"
  s4_unit: "°F"
  s4_tap_action: "script.dummy_script"
  s4_icon: ${s1_icon}  # <--- Reference s1 instead of typing "\ue1ff" again
  # glyph to show when the entity is unavailable/invalid — change to any Material Icon code you like
  s4_unavail_icon: "$s1_unavail_icon"
  
  s4_icon_logic: |-
    return "${s4_icon}";
    
  s4_color_logic: |-
    if (x > 0) return lv_color_hex(0x00008B);   
    return lv_color_hex(0x888888);               

  # --- SENSOR 5: BATTERY (Dynamic Icons) ---
  s5_entity: "sensor.foxess_bat_soc"
  s5_label: "Home Battery"
  s5_unit: "%%"
  s5_tap_action: "script.dummy_script"
  
  s5_default_icon: "\uebd2" 
  s5_all_dynamic_icons: "\uebd2\uebd4\uebe2\uebdd\uebe0\uebd9"

  s5_icon_logic: |-
    if (x >= 90) return "\uebd2";
    if (x >= 75) return "\uebd4";
    if (x >= 50) return "\uebe2";
    if (x >= 30) return "\uebdd";
    if (x >= 20) return "\uebe0";
    return "\uebd9";
    
  s5_color_logic: |-
    if (x >= 90) return lv_color_hex(0x008000);  
    if (x >= 75) return lv_color_hex(0x269a17);  
    if (x >= 50) return lv_color_hex(0xa6d51f);  
    if (x >= 30) return lv_color_hex(0xFFA500);  
    if (x >= 20) return lv_color_hex(0x8B0000);  
    return lv_color_hex(0x640B0B);               

  # --- SENSOR 6: OUTDOOR ---
  s6_entity: "sensor.outside_environment_outdoor_temperature"
  s6_label: "Outdoor"
  s6_unit: "F"
  s6_tap_action: "script.dummy_script"
  # default Material Icon ligature for humidity-ish display — use ligature name so font ligatures render
  s6_icon: "wb_cloudy"

  s6_icon_logic: |-
    return "${s6_icon}";
    
  s6_color_logic: |-
    if (x > 80) return lv_color_hex(0x00BFFF);   
    if (x > 60) return lv_color_hex(0x87CEEB);   
    if (x < 30) return lv_color_hex(0xFFD700);   
    return lv_color_hex(0x32CD32);  

http_request:
  timeout: 5s

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
#    default_transition_length: 0.5s
    default_transition_length: 0s

spi:
#  - id: tft
#    clk_pin: GPIO14
#    mosi_pin: GPIO13
#    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

#  - id: my_touchscreen
#    clk_pin: GPIO25
#    mosi_pin: GPIO32
#    miso_pin: GPIO39


display:
  - platform: ili9xxx
    id: my_display
    spi_id: lcd
    # model: ILI9341
    # model: ST7789V
    model: ILI9342
    color_palette: 8BIT
    cs_pin: 15
    dc_pin: 2
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    

    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

    dimensions:
      width: 320
      height: 240

touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  calibration:
    x_min: 220
    x_max: 3756
    y_min: 394
    y_max: 3749
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: false

# --- FONTS ---
font:
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    glyphs: "0123456789%.°WCcFfkmVA -N/"
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    glyphs: "0123456789:/- abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚáéíóúÀàÇçÃãÕõ°"
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÁÉÍÓÚáéíóúÀàÇçÃãÕõ°"
  - file: "gfonts://Material Icons"
    id: icon_font_32
    size: 32
    # Auto-populates based on your substitutions — add the weather ligatures we will use
    glyphs: "${s1_icon}${s1_unavail_icon}${s5_all_dynamic_icons}${s6_icon} wb_sunny cloud umbrella ac_unit filter_drama air flash_on wb_cloudy"

# --- TIME ---
time:
  - platform: homeassistant
    id: esptime
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: label_clock
              text: !lambda 'return id(esptime).now().strftime("%H:%M");'
          - lvgl.label.update:
              id: label_date
              text: !lambda |-
                static const char *const dias[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                auto now = id(esptime).now();
                return str_sprintf("%s %02d/%02d", dias[now.day_of_week - 1], now.day_of_month, now.month);

